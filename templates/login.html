<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Koperasi Gabe Artha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #2c3e50; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { max-width: 400px; width: 100%; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-header { background-color: #ffffff; padding: 30px 20px 20px; text-align: center; }
        .login-body { background-color: #f8f9fa; padding: 30px; }
        .logo-icon { font-size: 3rem; color: #3498db; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="fa-solid fa-building-columns logo-icon"></i>
            <h4 class="fw-bold text-dark mb-0">KSP Gabe Artha Nauli</h4>
            <p class="text-muted small mt-1">Sistem Informasi Manajemen Terpadu</p>
        </div>
        <div class="login-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} py-2 small fw-bold"><i class="fa-solid fa-circle-exclamation me-1"></i>{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary small">Username / Nama Anggota</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Staf: Username | Nasabah: Nama Lengkap" required autocomplete="off">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary small">Password / Nomor Anggota</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" name="password" id="passwordInput" class="form-control border-end-0" placeholder="Staf: Password | Nasabah: Nomor Anggota" required>
                        <span class="input-group-text bg-white" id="togglePassword" style="cursor: pointer;" title="Tampilkan Password">
                            <i class="fa-solid fa-eye text-muted" id="toggleIcon"></i>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm"><i class="fa-solid fa-right-to-bracket me-2"></i> Masuk Sistem</button>
            </form>
            <div class="text-center mt-4 pt-3 border-top">
                <small class="text-muted">© 2026 KSP Gabe Artha Nauli</small>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('passwordInput');
            const toggleIcon = document.getElementById('toggleIcon');
            
            // Cek apakah tipenya saat ini password
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text'; // Ubah jadi teks terlihat
                toggleIcon.classList.replace('fa-eye', 'fa-eye-slash'); // Ganti jadi ikon mata disilang
            } else {
                passwordInput.type = 'password'; // Ubah kembali jadi titik-titik
                toggleIcon.classList.replace('fa-eye-slash', 'fa-eye'); // Ganti jadi ikon mata biasa
            }
        });
    </script>
</body>
</html>
